name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix flake check --keep-going -L
      - run: nix build .#release -L
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Check tag matches TOC version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(tr -d '\r' < MerrinxUI/MerrinxUI.toc | sed -n 's/^## Version:[[:space:]]*//p' | sed 's/[[:space:]]*$//' | head -n1)
          if [ -z "$v" ]; then echo "no ## Version: line found in MerrinxUI/MerrinxUI.toc" >&2; exit 1; fi
          case "$TAG" in "v$v"|"v$v"-*) ;; *) echo "tag $TAG does not match TOC version $v" >&2; exit 1 ;; esac
      - name: Build and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          nix build .#release -L
          cp result/MerrinxUI.zip "MerrinxUI-$TAG.zip"
          pre=""; case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" "MerrinxUI-$TAG.zip" --repo "$GITHUB_REPOSITORY" --title "MerrinxUI $TAG" --generate-notes $pre
      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          iface=$(tr -d '\r' < MerrinxUI/MerrinxUI.toc | sed -n 's/^## Interface:[[:space:]]*//p' | sed 's/[[:space:]]*$//' | head -n1)
          gv="$((iface / 10000)).$((iface / 100 % 100)).$((iface % 100))"
          ids=$(curl -sS --fail-with-body -H "X-Api-Token: $CF_API_KEY" https://wow.curseforge.com/api/game/versions | jq -c --arg gv "$gv" '[.[] | select(.name == $gv) | .id]')
          if [ "$(jq length <<<"$ids")" != 1 ]; then echo "expected one CurseForge game version named $gv, got $ids" >&2; exit 1; fi
          type=release; case "$TAG" in *-*) type=beta ;; esac
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > changelog.md
          jq -n --arg name "MerrinxUI $TAG" --arg type "$type" --argjson ids "$ids" --rawfile changelog changelog.md \
            '{displayName: $name, releaseType: $type, gameVersions: $ids, changelog: $changelog, changelogType: "markdown"}' > metadata.json
          curl -sS --fail-with-body -H "X-Api-Token: $CF_API_KEY" -F "metadata=<metadata.json" -F "file=@MerrinxUI-$TAG.zip" \
            https://wow.curseforge.com/api/projects/1798762/upload-file
